agrocenter:
  security:
    jwt:
      issuer-uri: ${COGNITO_ISSUER_URI}
      jwk-set-uri: ${COGNITO_JWK_SET_URI}
      audience: ${COGNITO_AUDIENCE}
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:https://front-web-seven.vercel.app,http://localhost:3000,http://localhost:5173}
    allowed-origin-patterns: ${ALLOWED_ORIGIN_PATTERNS:https://*.vercel.app}

services:
  inventory:
    base-url: ${INVENTORY_SERVICE_URL:${MS_INVENTARIO_URL:http://ms-inventario-svc:8081}}
  sales:
    base-url: ${SALES_SERVICE_URL:${MS_VENTAS_URL:http://ms-ventas-svc:8082}}
  purchases:
    base-url: ${PURCHASES_SERVICE_URL:${MS_COMPRAS_URL:http://ms-compras-svc:8083}}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
