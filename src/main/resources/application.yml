server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: bff-web
  jackson:
    time-zone: UTC

agrocenter:
  security:
    jwt:
      issuer-uri: ${COGNITO_ISSUER_URI:http://localhost:9999/mock-cognito}
      jwk-set-uri: ${COGNITO_JWK_SET_URI:http://localhost:9999/mock-cognito/.well-known/jwks.json}
      audience: ${COGNITO_AUDIENCE:agrocenter-api}
    dev:
      jwt-secret: ${DEV_JWT_SECRET:}
      issuer: ${DEV_JWT_ISSUER:http://localhost:8081/dev-issuer}
      audience: ${COGNITO_AUDIENCE:agrocenter-api}
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:https://front-web-seven.vercel.app,http://localhost:3000,http://localhost:5173}
    allowed-origin-patterns: ${ALLOWED_ORIGIN_PATTERNS:https://*.vercel.app}

services:
  inventory:
    base-url: ${MS_INVENTARIO_URL:http://localhost:8081}
    connect-timeout: ${MS_INVENTARIO_CONNECT_TIMEOUT:2s}
    response-timeout: ${MS_INVENTARIO_RESPONSE_TIMEOUT:4s}
  sales:
    base-url: ${MS_VENTAS_URL:http://localhost:8082}
    connect-timeout: ${MS_VENTAS_CONNECT_TIMEOUT:2s}
    response-timeout: ${MS_VENTAS_RESPONSE_TIMEOUT:6s}
  purchases:
    base-url: ${MS_COMPRAS_URL:http://localhost:8083}
    connect-timeout: ${MS_COMPRAS_CONNECT_TIMEOUT:2s}
    response-timeout: ${MS_COMPRAS_RESPONSE_TIMEOUT:4s}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html
